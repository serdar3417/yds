<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5. Sınıf Bilişim - Problem Çözme Atölyesi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1d4ed8;
      --card: #ffffff;
      --accent: #f59e0b;
      --ok: #059669;
      --bad: #dc2626;
    }

    body {
      background: radial-gradient(circle at top right, #38bdf8 0%, transparent 30%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #0f172a;
    }

    .hero {
      border-radius: 1.25rem;
      color: #fff;
      background: linear-gradient(120deg, rgba(15,23,42,.9), rgba(30,58,138,.75));
      box-shadow: 0 12px 32px rgba(2, 6, 23, .35);
    }

    .glass {
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 1rem;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .18);
    }

    .week-tag {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      padding: .25rem .7rem;
      font-size: .8rem;
      font-weight: 600;
    }

    .profile-pic {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
      display: none;
    }

    .feedback {
      border-radius: .75rem;
      padding: .8rem;
      margin-top: .5rem;
      font-size: .94rem;
    }

    .correct { background: #ecfdf5; color: var(--ok); border: 1px solid #a7f3d0; }
    .wrong { background: #fef2f2; color: var(--bad); border: 1px solid #fecaca; }

    .sticky-settings {
      position: sticky;
      top: 1rem;
    }

    @media (max-width: 767px) {
      .sticky-settings { position: static; }
    }
  </style>
</head>
<body>
  <div class="container py-4 py-md-5">
    <section class="hero p-4 p-md-5 mb-4">
      <div class="d-flex flex-column flex-md-row gap-3 align-items-md-center justify-content-between">
        <div>
          <h1 class="h3 h-md-2 fw-bold">🎯 5. Sınıf Bilişim Eğlenceli Öğrenme Sayfası</h1>
          <p class="mb-0 text-white-50">Problem çözme, algoritma düşünme, veri, değişken-sabit, operatörler ve haftalık uygulamalar.</p>
        </div>
        <span class="badge text-bg-warning fs-6">Tek Sayfa Eğitim Uygulaması</span>
      </div>
    </section>

    <div class="row g-4">
      <div class="col-lg-4">
        <aside class="glass p-3 p-md-4 sticky-settings">
          <h2 class="h5 mb-3">⚙️ Ayarlar</h2>
          <div class="mb-3">
            <label for="studentName" class="form-label">Adın</label>
            <input type="text" id="studentName" class="form-control" placeholder="Örn: Ece" />
          </div>

          <div class="mb-3">
            <label for="studentPhoto" class="form-label">Fotoğraf Yükle</label>
            <input type="file" id="studentPhoto" class="form-control" accept="image/*" />
          </div>

          <div class="d-flex align-items-center gap-3 mb-3">
            <img id="photoPreview" class="profile-pic" alt="Profil Fotoğrafı" />
            <div>
              <p class="mb-1 small text-secondary">Öğrenci Kartı</p>
              <p id="namePreview" class="fw-semibold mb-0">Merhaba, Öğrenci 👋</p>
            </div>
          </div>

          <button id="saveProfile" class="btn btn-primary w-100">Profili Güncelle</button>
          <hr>
          <p class="small text-secondary mb-0">Aşağıdaki her haftada açık uçlu sorular var. Cevabı yazıp <b>Kontrol Et</b> tuşuna bas.</p>
        </aside>
      </div>

      <div class="col-lg-8">
        <main class="d-grid gap-3" id="weeksContainer"></main>
      </div>
    </div>
  </div>

  <script>
    const weeks = [
      {
        week: "1. Hafta",
        title: "Problem ve Problem Çözme + Kurt-Kuzu-Ot",
        summary: "Problem nedir, problem çözme adımları nelerdir ve klasik mantık problemi nasıl çözülür?",
        questions: [
          {
            q: "Sence problem nedir? Kendi cümlelerinle tanımla.",
            expected: ["çözüm", "zor", "durum", "bilgi", "dikkat"],
            answer: "Problem; çözüm gerektiren, düşünme ve dikkat isteyen bir durumdur."
          },
          {
            q: "Kurt-Kuzu-Ot probleminde güvenli geçiş sırasını yaz.",
            expected: ["kuzu", "geri", "kurt", "ot"],
            answer: "Sıra: 1) Kuzuyu geçir, 2) Geri dön, 3) Kurdu geçir, 4) Kuzuyu geri getir, 5) Otu geçir, 6) Geri dön, 7) Kuzuyu geçir."
          }
        ]
      },
      {
        week: "2. Hafta",
        title: "Problem Çözme Stratejileri + Balık Kılçığı",
        summary: "Deneme-yanılma, görselleştirme, parçalama, tersten gitme ve neden-sonuç analizi.",
        questions: [
          {
            q: "Balık kılçığı yönteminde problem ve nedenler nereye yazılır?",
            expected: ["baş", "neden", "kılçık", "gövde"],
            answer: "Balığın başına ana problem yazılır; gövdeye bağlı kılçıklara ise nedenler ve alt nedenler yazılır."
          },
          {
            q: "‘Sular kirleniyor’ problemi için 2 neden ve 1 çözüm yaz.",
            expected: ["fabrika", "çöp", "arıtma", "denetim", "geri dönüşüm"],
            answer: "Nedenler: fabrika atıkları, bilinçsiz çöp atımı. Çözüm: arıtma/denetim ve geri dönüşüm sistemlerini güçlendirmek."
          }
        ]
      },
      {
        week: "3. Hafta",
        title: "Adres Tarifi, Kağıt Katlama, Dinle-Çiz",
        summary: "Doğru yönerge, adım adım algoritma ve hatalı komutun sonucu.",
        questions: [
          {
            q: "Adres tarifinde algoritmik düşünme neden önemlidir?",
            expected: ["sıra", "adım", "doğru", "karış", "net"],
            answer: "Çünkü adımlar doğru sırada ve net olmazsa kişi hedefe ulaşamaz; küçük bir yön hatası tüm sonucu bozabilir."
          },
          {
            q: "Müzeden otele dönüş tarifindeki hatalı adım neydi?",
            expected: ["7", "sağa", "sola"],
            answer: "7. adımda ‘sola dön’ hatalıdır; doğrusu ‘sağa dön’dür."
          }
        ]
      },
      {
        week: "4. Hafta",
        title: "Veri Nedir? Sabit-Değişken, Veri Toplama",
        summary: "Veri kavramı, günlük hayatta veri örnekleri ve anket analizi.",
        questions: [
          {
            q: "Veri ile bilgi arasındaki farkı kısa bir örnekle açıkla.",
            expected: ["fotoğraf", "özellik", "ham", "yorum"],
            answer: "Veri ham gerçeklerdir (ör. saç rengi, boy), bilgi ise bu verilerin anlamlandırılmış hâlidir (ör. fotoğrafla kişiyi tanıma)."
          },
          {
            q: "Kek örneğindeki sabit ve değişken malzemelere birer örnek yaz.",
            expected: ["un", "yumurta", "şeker", "kakao", "ceviz", "değişken", "sabit"],
            answer: "Sabit: un/yumurta/şeker. Değişken: kakao, ceviz, elma gibi isteğe göre eklenenler."
          }
        ]
      },
      {
        week: "5. Hafta",
        title: "Operatörler ve İşlem Önceliği",
        summary: "Matematiksel ve mantıksal operatörler, işlem sırası ve doğru yorumlama.",
        questions: [
          {
            q: "Matematiksel operatörlerden 4 tane yaz ve ne yaptıklarını belirt.",
            expected: ["+", "-", "*", "/", "toplama", "çıkarma", "çarpma", "bölme"],
            answer: "+ toplama, - çıkarma, * çarpma, / bölme işlemi yapar."
          },
          {
            q: "Mantıksal operatörlerden VE, VEYA, DEĞİL ne işe yarar?",
            expected: ["ve", "veya", "değil", "koşul", "doğru", "yanlış"],
            answer: "Koşulları birleştirip değerlendirir: VE (ikisi de doğru), VEYA (en az biri doğru), DEĞİL (sonucu tersler)."
          }
        ]
      }
    ];

    const weeksContainer = document.getElementById("weeksContainer");

    function normalize(text) {
      return text.toLowerCase()
        .replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s")
        .replace(/ı/g, "i").replace(/ö/g, "o").replace(/ç/g, "c");
    }

    function scoreAnswer(userText, expectedKeywords) {
      const n = normalize(userText);
      let hit = 0;
      expectedKeywords.forEach(k => {
        if (n.includes(normalize(k))) hit++;
      });
      return hit / expectedKeywords.length;
    }

    function renderWeeks() {
      weeks.forEach((w, wIndex) => {
        const card = document.createElement("section");
        card.className = "glass p-3 p-md-4";

        let qHtml = "";
        w.questions.forEach((item, qIndex) => {
          const id = `w${wIndex}q${qIndex}`;
          qHtml += `
            <div class="border rounded-3 p-3 mb-3 bg-white">
              <p class="fw-semibold mb-2">${qIndex + 1}) ${item.q}</p>
              <textarea class="form-control mb-2" id="${id}-input" rows="3" placeholder="Cevabını buraya yaz..."></textarea>
              <button class="btn btn-outline-primary btn-sm" onclick="checkAnswer(${wIndex}, ${qIndex})">Kontrol Et</button>
              <div id="${id}-feedback"></div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
            <h2 class="h5 mb-0">${w.title}</h2>
            <span class="week-tag">${w.week}</span>
          </div>
          <p class="text-secondary small mb-3">${w.summary}</p>
          ${qHtml}
        `;

        weeksContainer.appendChild(card);
      });
    }

    window.checkAnswer = function(wIndex, qIndex) {
      const q = weeks[wIndex].questions[qIndex];
      const id = `w${wIndex}q${qIndex}`;
      const inputEl = document.getElementById(`${id}-input`);
      const fb = document.getElementById(`${id}-feedback`);
      const val = inputEl.value.trim();

      if (!val) {
        fb.innerHTML = `<div class="feedback wrong">Lütfen önce bir cevap yaz. ✍️</div>`;
        return;
      }

      const s = scoreAnswer(val, q.expected);
      if (s >= 0.5) {
        fb.innerHTML = `<div class="feedback correct">✅ Güzel cevap! Doğru noktaların çoğunu yakaladın.</div>`;
      } else {
        fb.innerHTML = `<div class="feedback wrong">❌ Cevap geliştirilmeli.<br><b>Doğruya yakın örnek cevap:</b> ${q.answer}</div>`;
      }
    };

    document.getElementById("saveProfile").addEventListener("click", () => {
      const name = document.getElementById("studentName").value.trim();
      document.getElementById("namePreview").textContent = name ? `Merhaba, ${name} 👋` : "Merhaba, Öğrenci 👋";
    });

    document.getElementById("studentPhoto").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = document.getElementById("photoPreview");
        img.src = evt.target.result;
        img.style.display = "block";
      };
      reader.readAsDataURL(file);
    });

    renderWeeks();
  </script>
</body>
</html>
